<style>
:root{

  --primary:#12524A; --primary-dark:#0A3A34; --primary-tint:#E4EDEA; --accent:#B8863A;
  --line:#DDE2DA; --correct:#276B41; --correct-bg:#E6F1E7; --correct-line:#9CC5A8;
  --wrong:#A6392F; --wrong-bg:#F8EAE7; --wrong-line:#DDB2AA; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A17; --surface:#1E2420; --ink:#EDEFEA; --ink-soft:#B7C0B8; --ink-faint:#7C877E;
    --primary:#5FAE9C; --primary-dark:#3F8272; --primary-tint:#233028;
    --accent:#D2A15C; --line:#333B34;
    --correct:#7FCB94; --correct-bg:#1E3226; --correct-line:#3E6E4E;
    --wrong:#E39089; --wrong-bg:#3A2422; --wrong-line:#7A423C;
  }
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',sans-serif; }
h1,h2,h3,.serif{ font-family:'Source Serif 4',serif; }
.wrap{ max-width:760px; margin:0 auto; padding:0 20px 80px; }
.home-hero{ padding:52px 20px 30px; text-align:left; max-width:760px; margin:0 auto; }
.home-hero .kicker{ color:var(--primary); font-weight:600; font-size:0.95rem; }
.home-hero h1{ font-size:2.3rem; margin:.35em 0 .3em; color:var(--ink); font-weight:600; }
.home-hero p{ color:var(--ink-soft); font-size:1.02rem; line-height:1.55; }
.section-label{ max-width:760px; margin:30px auto 0; padding:0 20px; font-family:'Source Serif 4',serif; font-size:1.1rem; font-weight:600; color:var(--primary); }
.exam-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:760px; margin:14px auto 0; padding:0 20px; }
@media (max-width:560px){ .exam-grid{ grid-template-columns:1fr; } }
.exam-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:10px; }
.exam-tile:hover{ border-color:var(--primary); }
.exam-tile .num{ font-family:'Source Serif 4',serif; font-size:1.3rem; color:var(--primary); font-weight:600; }
.exam-tile .status{ font-size:.86rem; color:var(--ink-faint); margin-top:auto; }
.topbar{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
.topbar-inner{ max-width:760px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; }
.back-btn{ background:none; border:1px solid var(--line); border-radius:8px; width:36px; height:36px; cursor:pointer; font-weight:bold; color:var(--ink);}
.topbar-title{ flex:1; }
.topbar-title .t1{ font-family:'Source Serif 4',serif; font-weight:600; font-size:1.08rem; }
.topbar-score{ font-size:.86rem; color:var(--ink-soft); }
.topbar-score b{ color:var(--primary); font-weight:700; }
.progress-track{ height:4px; background:var(--line); max-width:760px; margin:0 auto; }
.progress-fill{ height:100%; background:var(--primary); width:0%; transition:width .25s ease; }
.qlist{ padding-top:26px; display:flex; flex-direction:column; gap:16px; }
.qcard{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--primary); border-radius:var(--radius); padding:18px 20px 20px; }
.qhead{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
.qindex{ font-family:'Source Serif 4',serif; font-weight:600; color:var(--ink-faint); }
.qtext{ font-size:1.04rem; line-height:1.5; font-weight:500; margin-bottom:12px;}
.opts{ display:flex; flex-direction:column; gap:8px; }
.opt{ display:flex; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:11px 14px; cursor:pointer; font-size:.97rem; }
.opt:hover{ border-color:var(--primary); }
.opt .lt{ font-weight:700; color:var(--ink-faint); width:1.3em; }
.opt.correct{ background:var(--correct-bg); border-color:var(--correct-line); }
.opt.correct .lt{ color:var(--correct); }
.opt.wrong{ background:var(--wrong-bg); border-color:var(--wrong-line); }
.opt.wrong .lt{ color:var(--wrong); }
.qcard.answered .opt{ cursor:default; pointer-events:none;}
.done-note{ margin-top:24px; padding:22px 20px; background:var(--primary); color:#fff; border-radius:var(--radius); text-align:center; }
</style>

let currentExamId = null;
let score = 0;
let answeredCount = 0;

// Thứ tự hiển thị đề thi trên trang chủ
const EXAM_ORDER = [
  "Đề 1 (File 20)",
  "Đề 2 (File 19)",
  "Đề 3 (File 18)",
  "Đề 8 (File 13)",
  "Đề 9 (File 12)",
  "Đề 10 (File 11)",
  "Đề 14 (File 10)",
  "Đề 15 (File 9)",
  "Đề 16 (File 8)",
  "Đề 17 (File 7)",
  "Đề 18 (File 6)",
  "Đề 19 (File 5)",
  "Đề 20 (File 4)",
  "Đề 21 (File 3)",
  "Đề 22 (File 2)",
  "Đề 23 (File 1)"
];

function renderHome() {
  let totalQuestions = 0;
  EXAM_ORDER.forEach(k => { if(EXAMS_DATA[k]) totalQuestions += EXAMS_DATA[k].length; });

  let html = `
  <div class="home-hero">
      <div class="kicker">Tiếng Anh Chuyên Ngành</div>
      <h1>Ngân hàng đề thi tổng hợp</h1>
      <p>Tất cả <b>${EXAM_ORDER.length} đề thi</b> (tổng cộng <b>${totalQuestions} câu hỏi</b>) đã được gom vào một trang duy nhất. Chọn một bộ đề bên dưới để bắt đầu ôn tập.</p>
  </div>
  <div class="exam-grid">`;

  EXAM_ORDER.forEach(key => {
    if(!EXAMS_DATA[key]) return;
    html += `
    <div class="exam-tile" onclick="startExam('${key.replace(/'/g,"\\'")}')">
        <div class="num">${key}</div>
        <div class="status">${EXAMS_DATA[key].length} câu hỏi</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function startExam(id) {
  currentExamId = id;
  score = 0;
  answeredCount = 0;
  renderExam();
  window.scrollTo(0, 0);
}

function answerQuestion(qIndex, selectedOpt, correctOpt) {
  const qCard = document.getElementById(`qcard-${qIndex}`);
  if(!qCard || qCard.classList.contains('answered')) return;

  qCard.classList.add('answered');
  const opts = qCard.querySelectorAll('.opt');

  opts.forEach((opt, idx) => {
    if(idx === correctOpt) opt.classList.add('correct');
    else if(idx === selectedOpt) opt.classList.add('wrong');
  });

  if(selectedOpt === correctOpt) score++;
  answeredCount++;

  const total = EXAMS_DATA[currentExamId].length;
  document.getElementById('score-text').innerText = `${score}/${total}`;
  document.getElementById('progress-bar').style.width = `${(answeredCount/total)*100}%`;

  if(answeredCount === total) {
    document.getElementById('done-container').innerHTML = `
      <div class="done-note">
        <h3>Hoàn thành đề thi!</h3>
        <p>Điểm của bạn: ${score} / ${total}</p>
      </div>`;
  }
}

function renderExam() {
  const data = EXAMS_DATA[currentExamId];
  const total = data.length;
  let html = `
  <div class="topbar">
      <div class="topbar-inner">
          <button class="back-btn" onclick="renderHome()">←</button>
          <div class="topbar-title"><div class="t1">${currentExamId}</div></div>
          <div class="topbar-score">Điểm: <b id="score-text">0/${total}</b></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
  </div>
  <div class="wrap"><div class="qlist">`;

  const letters = ['A', 'B', 'C', 'D', 'E'];

  data.forEach((q, index) => {
    let optsHtml = '';
    q.o.forEach((optText, optIndex) => {
      optsHtml += `
      <div class="opt" onclick="answerQuestion(${index}, ${optIndex}, ${q.c})">
          <div class="lt">${letters[optIndex]}</div>
          <div>${optText}</div>
      </div>`;
    });

    html += `
    <div class="qcard" id="qcard-${index}">
        <div class="qhead">
            <span class="qindex">Câu ${index + 1}</span>
        </div>
        <div class="qtext">${q.q}</div>
        <div class="opts">${optsHtml}</div>
    </div>`;
  });

  html += `</div><div id="done-container"></div></div>`;
  document.getElementById('app').innerHTML = html;
}

// Khởi chạy
renderHome();
